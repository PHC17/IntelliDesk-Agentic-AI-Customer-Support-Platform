services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["optional"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellidesk
      POSTGRES_USER: intellidesk
      POSTGRES_PASSWORD: intellidesk
    ports:
      - "5432:5432"
    profiles: ["optional"]
